[tools]
# Language runtimes
zig = "latest"
bun = "1.4"

# Formatting & Linting
shfmt = "latest"
stylua = "latest"

# Build tools
cmake = "latest"
ninja = "latest"

# Shell tools
git = "latest"
gnu-sed = "latest"
gnu-tar = "latest"
gnu-grep = "latest"

# Testing

[env]
# Common environment variables

[tasks.setup]
description = "Install pinned JS dev tools (Prettier) from bun.lock"
run = "bun install --frozen-lockfile"

[tasks.lint]
run = "bun install --frozen-lockfile && bunx --no-install --bun prettier --check ."

[tasks.fmt]
run = "bun install --frozen-lockfile && bunx --no-install --bun prettier --write ."
